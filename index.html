<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div class="sidebar">
            <a href="https://github.com/hawaiianborgir" target="_blank" rel="noopener noreferrer" class="nav-button" aria-current="page">
                <img src="" alt="" class="logo-icon">
                <span class="logo-font">Library</span>
            </a>
            <button type="button">Add New Book</button>
        </div>

        <div class="card-status">
            <div class="total-status">
                <output class="total-output"></output>
                <p>Total</p>
            </div>
            <div class="read-status"><output class="read-output"></output>
            <p>Read</p></div>
            <div class="not-read-status"></div>
        </div>

        <div class="main-content">
            <div class="book-card">
                <p class="book-title">The Two Towers</p>
                <p class="book-author">J.R.R. Tolkien</p>
                <p class="book-year">1954</p>
                <p class="book-pages">352</p>
                <p class="book-read">Read: ✓</p>
            </div>
            <div class="book-card">
                <p class="book-title">To Kill a Mockingbird</p>
                <p class="book-author">Harper Lee</p>
                <p class="book-year">1960</p>
                <p class="book-pages">281</p>
                <p class="book-read">Read: ✓</p>
            </div>
            <div class="book-card">
                <p class="book-title">Pride and Prejudice</p>
                <p class="book-author">Jane Austen</p>
                <p class="book-year">1813</p>
                <p class="book-pages">279</p>
                <p class="book-read">Read: ✗</p>
            </div>
        </div>

        <form class="form-container">
            <h3 class="caption">Please input your new book information for the library</h3>
            <div class="input-container">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
                <label for="author">Author</label>
                <input type="text" id="author" name="author" required>
                <label for="year">Year</label>
                <input type="tel" pattern="[0-9]{4}" inputmode="numeric" maxlength="4" id="year" name="year" required>
                <label for="pages">Pages</label>
                <input type="tel" inputmode="numeric" id="pages" name="pages" required>
                <div class="checkbox-container">
                    <input type="hidden" name="read" value="false">
                    <label for="read">Have you read it?</label>
                    <input type="checkbox" id="read" name="read" value="true">
                </div>
            </div>
            <button type="submit" class="new-button">New Book</button>
        </form>

        <form>
            <div>
                <input
                type="checkbox"
                id="subscribeNews"
                name="subscribe"
                value="newsletter" />
                <label for="subscribeNews">Subscribe to newsletter?</label>
            </div>
            <div>
                <button type="submit">Subscribe</button>
            </div>
        </form>
        
    </div>
</body>
</html>

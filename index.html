<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <form class="form-container">
            <h3 class="caption">Please input your new book information for the library</h3>
            <div class="input-container">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
                <label for="author">Author</label>
                <input type="text" id="author" name="author" required>
                <label for="year">Year</label>
                <input type="tel" pattern="[0-9]{4}" inputmode="numeric" maxlength="4" id="year" name="year" required>
                <label for="pages">Pages</label>
                <input type="tel" inputmode="numeric" id="pages" name="pages" required>
                <fieldset>
                    <legend>Have you read it?</legend>
                    <div class="yes-option">
                        <input type="radio" id="yes" name="isRead" value="yes" required>
                        <label for="yes">Yes</label>
                    </div>
                    <div class="no-option">
                        <input type="radio" id="no" name="isRead" value="no" required>
                        <label for="no">No</label>
                    </div>
                </fieldset>
            </div>
            <button type="submit" class="new-button">New Book</button>
        </form>
        <div class="table-container">
            <h1>Book List</h1>
            <table>
                <caption>Books available in the library</caption>
                <thead>
                    <th scope="col">Title</th>
                    <th scope="col">Author</th>
                    <th scope="col">Year</th>
                    <th scope="col">Pages</th>
                    <th scope="col">Read</th>
                    <th scope="col">ID</th>
                    <th scope="col">Delete</th>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>

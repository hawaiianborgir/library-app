<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <form class="form-container">
            <h3 class="caption">Please input your new book information for the library</h3>
            <div class="input-container">
                <label for="title">Title</label>
                <input type="text" id="title" name="title">
                <label for="author">Author</label>
                <input type="text" id="author" name="author">
                <label for="year">Year</label>
                <input type="text" id="year" name="year">
                <label for="pages">Pages</label>
                <input type="text" id="pages" name="pages">
                <label for="isRead">Read</label>
                <input type="text" id="read" name="isRead">
            </div>
            <button type="submit" class="new-button">New Book</button>
        </form>

        <div class="table-container">
            <h1>Book List</h1>
            <table>
                <caption>Books available in the library</caption>
                <thead>
                    <th scope="col">Title</th>
                    <th scope="col">Author</th>
                    <th scope="col">Year</th>
                    <th scope="col">Pages</th>
                    <th scope="col">Read</th>
                    <th scope="col">ID</th>
                    <th scope="col">Delete</th>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
